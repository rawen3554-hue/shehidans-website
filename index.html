<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30 Shehidans</title>
  <style>
    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      font-family: "Segoe UI", Tahoma, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    h1 { font-size: 24px; margin-bottom: 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
    
    /* Windows 7 Aero Glass Card */
    .win7-window {
      width: 100%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.37);
      margin-top: 20px;
    }
    .win7-titlebar {
      background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.3);
      font-size: 12px;
      font-weight: bold;
      text-shadow: 0 1px 2px #000;
    }
    .win7-content {
      padding: 20px;
      text-align: center;
    }
    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h1>30 Shehidans</h1>
  <p style="opacity: 0.9; font-size: 14px;">Official Public Web Page</p>

  <!-- Windows 7 Music Section -->
  <div class="win7-window">
    <div class="win7-titlebar">Windows Media Player - Music Section</div>
    <div class="win7-content">
      <div style="font-size: 40px; margin-bottom: 10px;">🎵</div>
      <div style="font-size: 16px; font-weight: bold;">30s Anthem Track</div>
      
      <audio controls>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
      </audio>
    </div>
  </div>

</body>
</html>
